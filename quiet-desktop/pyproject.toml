[project]
name = "freiren-quiet"
version = "0.1.0"
description = "A quiet-mode controller for MSI GL62 6QE, built on power-profiles-daemon and GTK"
requires-python = ">=3.11"
dependencies = ["psutil>=6,<8"]
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
