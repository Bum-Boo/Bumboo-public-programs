# Smoke and unit checks for each public program, run on Linux only.
#
# NOT covered here (needs hardware, a desktop session or proprietary hosts):
#   - Windows/macOS behaviour of any tool
#   - Adobe After Effects / Premiere runtime (aid-vfx-toolkit/ae, typecast-shorts-toolkit/apps)
#   - Real MSI GL62 6QE hardware, power-profiles-daemon D-Bus, KWin, systemd units
#     (quiet-desktop, quiet-controller-plugin, frieren-os-controller)
#   - Interactive GUI use: GTK windows beyond a startup check, Qt tray/CAVA,
#     WebGL/canvas rendering in a real browser
#   - Real model downloads/inference (aid-vfx-toolkit depth and landmark models)
#   - Live systemd user manager, KDE Plasma, cron daemon, Codex/Claude CLIs
name: Public programs smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: emergent-life-lab
            check: npm run check
          - project: procedural-soundscape
            check: npm run check
          - project: typecast-shorts-toolkit
            check: npm test && npm run build
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: ${{ matrix.check }}

  hermes-pet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: hermes-pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  agent-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python -m unittest -v
        working-directory: agent-workflow/components/agent-task

  aid-vfx-toolkit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aid-vfx-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgles2 libegl1
      - run: python -m pip install -r requirements.txt
      # Model downloads are blocked inside the tests; depth/landmark inference uses fakes.
      - run: python -m unittest discover -s tests -v

  grimoire-companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grimoire-companion
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests tools
      - run: pytest -q
      - run: grimoire --demo --capture "$RUNNER_TEMP/grimoire-preview.png"

  frieren-os-controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frieren-os-controller
    steps:
      - uses: actions/checkout@v4
      # System python: apt's PyGObject is built for /usr/bin/python3 only.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 xvfb
      - run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e . ruff
      # Fake systemctl/Quiet backends; the real systemd verifier test skips without a user manager.
      - run: xvfb-run -a .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .

  quiet:
    name: ${{ matrix.project }} (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [quiet-desktop, quiet-controller-plugin]
        python: ['3.11', '3.13']
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Fake sysfs and fake power-profiles daemon; no real CPU/power settings change.
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q freiren_quiet scripts
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  quiet-desktop-gtk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quiet-desktop
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils python3-gi gir1.2-gtk-3.0 python3-psutil xvfb
      - run: desktop-file-validate packaging/io.github.BumBoo.FreirenQuiet.desktop
      # System python so apt's PyGObject is importable; runs the GTK startup smoke test.
      - run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
