[project]
name = "frieren-os-controller-quiet-plugin"
version = "0.3.0"
description = "Headless power and thermal plugin for Frieren OS Controller on MSI GL62 6QE"
requires-python = ">=3.11"
dependencies = ["psutil>=6,<8"]
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
