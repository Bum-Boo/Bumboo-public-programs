[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "frieren-os-controller"
version = "0.6.0"
description = "Local GTK and MCP controller for Frieren OS services, timers and status cards"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=2.2,<3", "psutil>=6,<8", "python-xlib>=0.33,<1"]

[project.scripts]
frieren-controller = "frieren_controller.cli:main"

[tool.setuptools.packages.find]
include = ["frieren_controller*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
