name: Checks
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests tools
      - run: pytest -q
      - run: QT_QPA_PLATFORM=offscreen grimoire --demo --capture /tmp/grimoire-preview.png
      - run: python -m build
